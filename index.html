<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canal Boat Painter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Canal Boat Painter</h1>
    <p>Pick a colour for each part of the boat to try out a paint scheme.</p>
  </header>

  <main>
    <!-- The boat drawing. Each paintable shape has a data-part attribute,
         which app.js uses to find it. data-paint says whether the colour
         applies to the shape's fill (default) or its outline (stroke). -->
    <figure class="drawing">
      <svg id="boat" viewBox="0 0 1000 250" role="img" aria-label="Side view of a narrowboat">

        <!-- Hull, with a raised bow on the left -->
        <path data-part="hull" d="M30 128 Q70 146 110 150 L950 150 L950 205 L130 205 Q60 200 30 128 Z"/>

        <!-- Gunwale: from the top ledge down to the highest rubbing strake -->
        <path data-part="gunwale" d="M34 122 Q74 140 110 143 L950 143 L950 170 L56 170 Q40 152 30 128 Z"/>

        <!-- Rubbing strakes: darker lines that follow whatever colour is beneath them -->
        <path d="M56 170 L950 170 M90 188 L950 188" stroke="rgba(0,0,0,0.35)" stroke-width="3" fill="none"/>

        <!-- Roof -->
        <rect data-part="roof" x="192" y="52" width="696" height="12" rx="4"/>
        
        <!-- Handrail -->
        <rect data-part="handrail" x="205" y="45" width="670" height="7" rx="3"/>

        <!-- Chimney (fixed colour) -->
        <rect x="290" y="18" width="14" height="30" fill="#2a2a2a"/>
        <rect x="286" y="14" width="22" height="6" fill="#b8962e"/>

        <!-- Cabin sides -->
        <rect data-part="cabin" x="200" y="64" width="680" height="79"/>

        <!-- Panels -->
        <rect data-part="panels" x="220" y="74" width="180" height="60" rx="6"/>
        <rect data-part="panels" x="440" y="74" width="180" height="60" rx="6"/>
        <rect data-part="panels" x="660" y="74" width="180" height="60" rx="6"/>

        <!-- Coachlines: borders around the outside edge of each panel -->
        <rect data-part="coachline" data-paint="stroke" x="220" y="74" width="180" height="60" rx="6" fill="none" stroke-width="2.5"/>
        <rect data-part="coachline" data-paint="stroke" x="440" y="74" width="180" height="60" rx="6" fill="none" stroke-width="2.5"/>
        <rect data-part="coachline" data-paint="stroke" x="660" y="74" width="180" height="60" rx="6" fill="none" stroke-width="2.5"/>

        <!-- Portholes (fixed colours: brass rim, dark glass) -->
        <g fill="#27343a" stroke="#b8962e" stroke-width="4">
          <circle cx="420" cy="104" r="11"/>
          <circle cx="640" cy="104" r="11"/>
          <circle cx="860" cy="104" r="11"/>
        </g>

        <!-- Tiller (fixed colour) -->
        <path d="M950 143 Q962 126 952 112 L902 104" stroke="#b8962e" stroke-width="4" fill="none" stroke-linecap="round"/>

        <!-- Water, drawn last so it covers the hull below the waterline -->
        <rect x="0" y="198" width="1000" height="52" fill="#5f7f7a" opacity="0.9"/>
      </svg>
    </figure>

    <!-- Colour controls. Each row has a part name, a row of palette swatches (added by app.js)
         and a "Custom" picker for any other colour. The picker's data-part matches a part of
         the drawing, and its value is that part's default colour. -->
    <section class="controls" aria-label="Paint colours">
      <div class="control">
        <span class="control-name">Cabin sides</span>
        <div class="swatches" role="group" aria-label="Cabin sides colours"></div>
        <label class="custom"><input type="color" data-part="cabin" data-name="Cabin sides" value="#e9d9a6"> Custom</label>
      </div>
      <div class="control">
        <span class="control-name">Panels</span>
        <div class="swatches" role="group" aria-label="Panels colours"></div>
        <label class="custom"><input type="color" data-part="panels" data-name="Panels" value="#1f4d34"> Custom</label>
      </div>
      <div class="control">
        <span class="control-name">Coachline</span>
        <div class="swatches" role="group" aria-label="Coachline colours"></div>
        <label class="custom"><input type="color" data-part="coachline" data-name="Coachline" value="#6e1d25"> Custom</label>
      </div>
      <div class="control">
        <span class="control-name">Roof</span>
        <div class="swatches" role="group" aria-label="Roof colours"></div>
        <label class="custom"><input type="color" data-part="roof" data-name="Roof" value="#6e1d25"> Custom</label>
      </div>
      <div class="control">
        <span class="control-name">Handrail</span>
        <div class="swatches" role="group" aria-label="Handrail colours"></div>
        <label class="custom"><input type="color" data-part="handrail" data-name="Handrail" value="#e9d9a6"> Custom</label>
      </div>
      <div class="control">
        <span class="control-name">Gunwale</span>
        <div class="swatches" role="group" aria-label="Gunwale colours"></div>
        <label class="custom"><input type="color" data-part="gunwale" data-name="Gunwale" value="#e9d9a6"> Custom</label>
      </div>
      <div class="control">
        <span class="control-name">Hull</span>
        <div class="swatches" role="group" aria-label="Hull colours"></div>
        <label class="custom"><input type="color" data-part="hull" data-name="Hull" value="#1c1c1c"> Custom</label>
      </div>
    </section>

    <!-- Actions -->
    <div class="actions">
      <button type="button" id="reset">Reset colours</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
